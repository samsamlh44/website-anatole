<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
    <!--Titre de l'onglet-->
    <title>Nous contacter</title>
    <!--Intégration du favicon-->
    <link rel="icon" type="image/png" href="icons/icon-light-16.png" />
    <!--Lien vers CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--Affichage du logo et du titre-->
  <div class="header"> <!--En-tête avec le logo-->
      <img src="icons/logo_anatole_light.png" alt="Logo Anatole" width="120" height="120" style="border-radius: 12px;">
  </div>
    <h1> <!--Titre principal-->
    Nous contacter
    </h1>
<!--Champs du formulaire de contact Formsubmit-->
<form action="https://formsubmit.co/contact@samsamdev.fr" method="POST">
    
    <div class="form">
        <label for="name">Votre nom :</label>
        <input type="text" name="name" required>

        <label for="email">Votre email :</label>
        <input type="email" name="email" required>

        <label for="message">Votre message :</label>
        <textarea name="message" required></textarea>

        <button type="submit" style="padding: 10px 24px; background-color: #38b6ff; color: #fff; border: none; border-radius: 6px; font-weight: 500; box-shadow: 0 2px 6px rgba(0,0,0,0.08); cursor: pointer;">Envoyer</button>
    </div>
</form>

<div class="rgpd">
    <p>Les données ne sont pas stockées. Elles sont uniquement envoyées par mail pour répondre à votre message.</p>
</div>
<p style="font-size: 0.8em;">
</p>

<style>
    .rgpd {
        font-size: 0.8em;
        color: #555;
        max-width: 500px;
        margin: 10px auto;
        text-align: center;
    }
    .form {
        display: flex; flex-direction: column; gap: 12px;
        max-width: 500px;
        margin: 0 auto;
        align-items: center;
        width: 100%;
        }

        .form input,
        .form textarea {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
</style>

<div class="retour">
<a href="index.html">Retour à l'accueil</a>
</div>
<style>
    .retour {
    margin-top: 30px;
    margin-bottom: 10px;
    margin-inline-start: 0px;
    line-height: 1;
    }
    .retour a {
        color: #000203;
        text-decoration: none;
        display: inline-block;
        padding: 8px 18px;
        background-color: #38b6ff;
        color: #fff;
        border-radius: 6px;
        font-weight: 500;
        border: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        width: 220px;
        text-align: center;
        }
        .retour a:hover {
        background-color: #005fa3;
        }
</style>
